services:
  bot:
    build: .
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    networks:
      - traefik
      - default
    depends_on:
      db:
        condition: service_healthy
    environment:
      # BOT_TOKEN may be supplied literally or via BOT_TOKEN_FILE (Docker secret).
      BOT_TOKEN: ${BOT_TOKEN:-}
      BOT_TOKEN_FILE: ${BOT_TOKEN_FILE:-}
      LLM_BASE_URL: ${LLM_BASE_URL:?Set LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      IMAGE_GENERATION_BASE_URL: ${IMAGE_GENERATION_BASE_URL:-}
      IMAGE_GENERATION_API_KEY: ${IMAGE_GENERATION_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      TAVILY_API_KEY_FILE: ${TAVILY_API_KEY_FILE:-}
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-bot}:${POSTGRES_PASSWORD:-bot}@db:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-bot}}
      # PG_PASSWORD_FILE (Docker secret) overrides the password in DATABASE_URL.
      PG_PASSWORD_FILE: ${PG_PASSWORD_FILE:-}
      LOGGING_LEVEL: ${LOGGING_LEVEL:-}
      TZ: ${TZ:-UTC}
      NODE_ENV: production
      PORT: ${PORT:-3000}
    # To use Docker secrets, uncomment the block below and the top-level
    # `secrets:` section, then point the *_FILE vars above at /run/secrets/<name>
    # (e.g. BOT_TOKEN_FILE=/run/secrets/bot_token).
    # secrets:
    #   - bot_token
    #   - tavily_api_key
    #   - pg_password
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Web-browse agent downloads — bind-mounted so files are accessible on the
      # host (configurable via DOWNLOADS_DIR).
      - "${DOWNLOADS_DIR:-./downloads}:/app/downloads"
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_DOCKER_NETWORK:-proxy}"
      - "traefik.http.routers.llm-tg-bot.rule=Host(`${TRAEFIK_HOST:-llm-tg-bot.example.com}`)"
      - "traefik.http.routers.llm-tg-bot.entrypoints=websecure"
      - "traefik.http.routers.llm-tg-bot.tls=true"
      - "traefik.http.routers.llm-tg-bot.tls.certresolver=cloudflare"
      # Route Traefik to the app's actual port: follow PORT (as the container's
      # listen port and published ports do) so setting PORT alone never leaves
      # Traefik pointing at a stale 3000. TRAEFIK_SERVICE_PORT still overrides.
      - "traefik.http.services.llm-tg-bot.loadbalancer.server.port=${TRAEFIK_SERVICE_PORT:-${PORT:-3000}}"

      - "homepage.group=${HOMEPAGE_GROUP:-AI}"
      - "homepage.name=LLM TG Bot"
      - "homepage.icon="
      - "homepage.href=https://${TRAEFIK_HOST:-llm-tg-bot.example.com}"

  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bot}
      POSTGRES_DB: ${POSTGRES_DB:-bot}
      TZ: ${TZ:-UTC}
      # For Docker secrets on the bundled db: replace the POSTGRES_PASSWORD line
      # above with `POSTGRES_PASSWORD_FILE: /run/secrets/pg_password` (the image
      # reads it natively; the two are mutually exclusive) and uncomment the
      # service-level `secrets:` mount below.
    # secrets:
    #   - pg_password
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Bind-mounted host directory for persistence (configurable via PG_DATA_DIR).
      - "${PG_DATA_DIR:-./data/pg}:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bot} -d ${POSTGRES_DB:-bot}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - default

networks:
  traefik:
    external: true
    name: "${TRAEFIK_DOCKER_NETWORK:-proxy}"
  default:

# Docker secrets (opt-in). Uncomment this block and the per-service `secrets:`
# mounts above, point each source at a file on the host (or an external secret),
# then set the matching *_FILE env vars to /run/secrets/<name>:
#   BOT_TOKEN_FILE=/run/secrets/bot_token
#   TAVILY_API_KEY_FILE=/run/secrets/tavily_api_key
#   PG_PASSWORD_FILE=/run/secrets/pg_password
# secrets:
#   bot_token:
#     file: ./secrets/bot_token
#   tavily_api_key:
#     file: ./secrets/tavily_api_key
#   pg_password:
#     file: ./secrets/pg_password
